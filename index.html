<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pawan Rana - Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #c9a84c;
      --gold-light: #f0d080;
      --dark: #0c0c14;
      --dark2: #13131f;
      --accent: #2a4a3e;
    }

    body {
      background: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Crimson Pro', serif;
    }

    .card {
      width: 480px;
      background: var(--dark2);
      border: 1px solid rgba(201,168,76,0.2);
      position: relative;
      overflow: hidden;
      animation: rise 1s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Top decorative band */
    .band {
      height: 6px;
      background: linear-gradient(90deg, var(--accent), var(--gold), var(--accent));
    }

    /* Photo section */
    .photo-section {
      position: relative;
      height: 320px;
      overflow: hidden;
    }

    .photo-section img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: contrast(1.05) saturate(0.9);
      display: block;
    }

    /* Gradient overlay on photo */
    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 40%,
        rgba(19,19,31,0.6) 70%,
        var(--dark2) 100%
      );
    }

    /* Name over photo */
    .name-on-photo {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 32px 20px;
    }

    .name-label {
      font-family: 'Crimson Pro', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 13px;
      letter-spacing: 0.4em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 4px;
      animation: fadeIn 1s ease 0.4s both;
    }

    .full-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 58px;
      letter-spacing: 0.06em;
      line-height: 1;
      color: #fff;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
      animation: fadeIn 1s ease 0.5s both;
    }

    .full-name span {
      color: var(--gold-light);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Body section */
    .body {
      padding: 24px 32px 32px;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      animation: fadeIn 1s ease 0.6s both;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .divider-dot {
      width: 5px; height: 5px;
      background: var(--gold);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    /* Welcome badge */
    .welcome-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
      border: 1px solid rgba(201,168,76,0.35);
      padding: 10px 20px;
      margin-bottom: 22px;
      animation: fadeIn 1s ease 0.7s both;
    }

    .welcome-badge .star { color: var(--gold); font-size: 14px; }

    .welcome-badge .text {
      font-family: 'Crimson Pro', serif;
      font-size: 17px;
      font-style: italic;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.05em;
    }

    /* Welcome big text */
    .welcome-big {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 36px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 6px;
      animation: fadeIn 1s ease 0.75s both;
    }

    .welcome-sub {
      font-size: 15px;
      color: rgba(255,255,255,0.4);
      font-style: italic;
      letter-spacing: 0.08em;
      margin-bottom: 26px;
      animation: fadeIn 1s ease 0.8s both;
    }

    /* Stats row */
    .stats {
      display: flex;
      gap: 0;
      border: 1px solid rgba(201,168,76,0.15);
      margin-bottom: 24px;
      animation: fadeIn 1s ease 0.9s both;
    }

    .stat {
      flex: 1;
      padding: 14px 16px;
      text-align: center;
      border-right: 1px solid rgba(201,168,76,0.15);
    }
    .stat:last-child { border-right: none; }

    .stat-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--gold-light);
      letter-spacing: 0.05em;
      line-height: 1;
    }

    .stat-label {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Footer */
    .footer-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: fadeIn 1s ease 1s both;
    }

    .location {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .location::before { content: '📍 '; font-size: 11px; }

    .badge-pr {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 0.25em;
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.4);
      padding: 4px 12px;
    }

    /* Corner accents */
    .corner-accent {
      position: absolute;
      width: 20px; height: 20px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.5;
    }
    .ca-tl { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
    .ca-tr { top: 8px; right: 8px; border-width: 1px 1px 0 0; }
    .ca-bl { bottom: 8px; left: 8px; border-width: 0 0 1px 1px; }
    .ca-br { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }
  </style>
</head>
